services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: forensight
      POSTGRES_USER: forensight
      POSTGRES_PASSWORD: forensight
    ports:
      - "5432:5432"
    volumes:
      - forensight_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  forensight_postgres:
